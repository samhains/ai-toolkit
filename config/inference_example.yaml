---
# Simple inference config - test checkpoints while training runs on another GPU
job: "generate"
config:
  name: "checkpoint_inference"
  process:
    - type: "to_folder"
      # Specify which GPU to use (e.g., "cuda:1" for second GPU)
      device: "cuda:1"

      # Data type for inference
      dtype: "fp16"

      # Where to save generated images
      output_folder: "./output/inference_samples"

      # Model configuration
      model:
        # Path to your checkpoint (can be HF model or local path)
        name_or_path: "black-forest-labs/FLUX.1-dev"

        # Testing LoRA checkpoint at step 7000
        lora_path: "./output/eagle_images_2/eagle_images_2_000007000.safetensors"
        lora_weight: 1.0

        arch: "flux"
        quantize: true
        low_vram: false

      # Generation settings
      generate:
        # Can be a list of prompts or path to text file (one prompt per line)
        prompts:
          - "an overwhelming series of wires and cables"
          - "A full-screen video game image shows a person standing under a stone archway in a forest."
          - "A close-up shot shows hands holding a purple mold with green, viscous material stretching between its spikes."
          - "A rectangular art piece with a duck painted on two sides stands upright on a patterned upholstered surface."
          - "Several people are gathered around a large, metallic, insect-like prop on a sandy ground outdoors."
          - "An album cover illustration depicts large monsters playing musical instruments with a blue sky background."
          - "Two stuffed toys with human-like faces and segmented bodies are standing side-by-side on a white surface."
          - "A colorful building with green and red accents features geometric patterns and reflective windows under a cloudy sky."
          - "An isometric cutaway illustration shows the interior of a multi-level vehicle with various rooms and icons."

        # Or use a prompt file:
          # z
        # prompts: "./test_prompts.txt"

        # Image dimensions
        width: 1024
        height: 1024

        # Sampling settings
        sampler: "flowmatch"
        sample_steps: 25
        guidance_scale: 4.0

        # Seed for reproducibility (-1 for random)
        seed: 42

        # Negative prompt
        neg: ""

        # Output format
        ext: "png"

        # Add prompt to output filename
        prompt_file: false

        # Number of times to repeat the prompt list
        num_repeats: 1

        # Compile model for faster inference (first run will be slower)
        compile: false
