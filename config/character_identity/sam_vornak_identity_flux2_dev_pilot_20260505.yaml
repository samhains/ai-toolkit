job: extension
config:
  name: sam_vornak_identity_flux2_dev_pilot_20260505
  process:
  - type: sd_trainer
    training_folder: output
    device: cuda:0
    trigger_word: vornak
    network:
      type: lora
      linear: 32
      linear_alpha: 32
    save:
      dtype: bf16
      save_every: 250
      max_step_saves_to_keep: 8
      push_to_supabase: false
    datasets:
    - folder_path: /home/excalibur/Code/ai-toolkit-updated/datasets/character_identity/sam_vornak_identity_20260501
      caption_ext: txt
      caption_dropout_rate: 0.0
      shuffle_tokens: false
      cache_latents_to_disk: true
      cache_text_embeddings: false
      resolution:
      - 512
      - 768
      - 1024
    train:
      batch_size: 1
      steps: 1500
      gradient_accumulation_steps: 1
      train_unet: true
      train_text_encoder: false
      unload_text_encoder: false
      gradient_checkpointing: true
      noise_scheduler: flowmatch
      optimizer: adamw8bit
      lr: 6.0e-05
      weight_decay: 1.0e-05
      dtype: bf16
      timestep_type: weighted
      content_or_style: balanced
    model:
      name_or_path: black-forest-labs/FLUX.2-dev
      arch: flux2
      quantize: true
      quantize_te: true
      low_vram: false
      qtype: qfloat8
      model_kwargs:
        match_target_res: false
    sample:
      sampler: flowmatch
      sample_every: 250
      width: 1024
      height: 1024
      sample_steps: 25
      guidance_scale: 4
      prompts:
      - "[trigger] person, close-up portrait photograph, neutral expression, natural daylight, simple background"
      - "[trigger] person, three-quarter view, slight smile, wearing a red jacket, outdoor street background"
      - "[trigger] person, profile view, dramatic side lighting, dark studio background"
      - "[trigger] person, full body, walking through a forest, wearing a long coat, natural daylight"
      seed: 42
      walk_seed: true
meta:
  name: sam_vornak_identity_flux2_dev_pilot_20260505
  version: identity-flux2-dev-pilot-20260505
  subject: sam
  trigger_phrase: vornak person
  base_model: black-forest-labs/FLUX.2-dev
  notes: "Pilot full FLUX.2-dev identity LoRA for testing whether the larger model preserves likeness and multi-character separation better than FLUX.2 Klein. Same neutral identity dataset and trigger as the Klein Sam LoRA."
